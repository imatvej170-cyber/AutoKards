<!DOCTYPE html>
<html lang="ru" data-theme="{{ 'dark' if appearance.dark else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoKards{% endblock %}</title>
    <style>
        :root {
            --bg-gradient-1: #fff5e6;
            --bg-gradient-2: #ffe0b3;
            --text-main: #4a2c00;
            --text-secondary: #6b3d00;
            --text-hint: #8a6538;
            --accent: #ff8c1a;
            --accent-hover: #e67a00;
            --accent-rgb: 255, 140, 26;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-bg-solid: #ffffff;
            --btn-secondary-bg: #ffffff;
            --border: #ffd9a6;
            --border-strong: #ff8c1a;
            --shadow: rgba(255, 140, 26, 0.15);
            --shadow-strong: rgba(255, 140, 26, 0.3);
            --neon: 0 0 10px rgba(255, 140, 26, 0.5), 0 0 25px rgba(255, 140, 26, 0.3);
            --neon-strong: 0 0 15px rgba(255, 140, 26, 0.8), 0 0 40px rgba(255, 140, 26, 0.5), 0 0 60px rgba(255, 140, 26, 0.3);
            --success: #2e7d32;
            --success-bg: #e8f5e9;
            --warn: #856404;
            --warn-bg: #fff3cd;
            --danger: #c62828;
            --danger-bg: #f8d7da;
            --white-glass: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --bg-gradient-1: #0f0f1e;
            --bg-gradient-2: #1a1a2e;
            --text-main: #e8e8f0;
            --text-secondary: #b8b8c8;
            --text-hint: #8a8a9a;
            --accent: #ff8c1a;
            --accent-hover: #ffb347;
            --accent-rgb: 255, 140, 26;
            --card-bg: rgba(30, 30, 50, 0.85);
            --card-bg-solid: #1e1e32;
            --btn-secondary-bg: #1e1e32;
            --border: #3a3a5a;
            --border-strong: #ff8c1a;
            --shadow: rgba(0, 0, 0, 0.5);
            --shadow-strong: rgba(255, 140, 26, 0.4);
            --neon: 0 0 10px rgba(255, 140, 26, 0.7), 0 0 25px rgba(255, 140, 26, 0.5), 0 0 40px rgba(255, 140, 26, 0.3);
            --neon-strong: 0 0 15px rgba(255, 140, 26, 1), 0 0 40px rgba(255, 140, 26, 0.7), 0 0 70px rgba(255, 140, 26, 0.5), 0 0 100px rgba(255, 140, 26, 0.3);
            --success: #81c784;
            --success-bg: #1b3a1e;
            --warn: #ffd54f;
            --warn-bg: #3a2f0a;
            --danger: #ef5350;
            --danger-bg: #3a1a1a;
            --white-glass: rgba(30, 30, 50, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.4s ease, color 0.4s ease;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }
        .logo {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: var(--neon-strong);
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .logo a { color: inherit; text-decoration: none; }

        .btn {
            padding: 16px 45px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 6px 18px var(--shadow-strong);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: var(--neon-strong);
        }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        .btn-secondary:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: var(--neon);
        }

        .form-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px var(--shadow);
            width: 100%;
            max-width: 420px;
        }
        [data-theme="dark"] .form-box {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 140, 26, 0.1);
        }
        .form-box h2 {
            color: var(--accent);
            font-size: 32px;
            margin-bottom: 25px;
            text-shadow: var(--neon);
        }
        .form-box input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            font-family: inherit;
            background: var(--card-bg-solid);
            color: var(--text-main);
        }
        .form-box input:focus { outline: none; border-color: var(--accent); box-shadow: var(--neon); }
        .form-box .btn { width: 100%; margin-top: 10px; }
        .form-link {
            display: block;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 15px;
        }
        .form-link a { color: var(--accent); font-weight: 700; text-decoration: none; }
        .form-link a:hover { text-decoration: underline; }

        .flash {
            background: var(--warn-bg);
            border: 2px solid var(--accent);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
        }
        [data-theme="dark"] .flash { box-shadow: var(--neon); }

        .welcome {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }
        .welcome strong { color: var(--accent); font-size: 24px; text-shadow: var(--neon); }

        .description {
            max-width: 750px;
            font-size: 19px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: var(--card-bg);
            padding: 30px 35px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-top: 20px;
        }
        .description strong { color: var(--accent); text-shadow: var(--neon); }

        .buttons { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }

        footer {
            background: var(--accent);
            color: #fff;
            padding: 25px 20px;
            text-align: center;
        }
        [data-theme="dark"] footer {
            box-shadow: 0 -4px 25px rgba(255, 140, 26, 0.4);
        }
        .footer-contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
            font-size: 16px;
        }
        .footer-contacts a {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .footer-contacts a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

        .float-buttons {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }
        .float-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, #ffb347 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 6px 20px var(--shadow-strong);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .float-btn { box-shadow: var(--neon-strong); }
        .float-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: var(--neon-strong);
        }
        .float-btn.hidden {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.5);
        }

        .notif-btn { position: relative; }
        .notif-count {
            position: absolute;
            top: -4px; right: -4px;
            min-width: 22px; height: 22px;
            padding: 0 6px; border-radius: 11px;
            background: #ff4d4d; color: #fff;
            font-size: 12px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 77, 77, 0.6);
        }
        [data-theme="dark"] .notif-count {
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.9), 0 2px 8px rgba(255, 77, 77, 0.6);
        }

        .level-widget { width: 100%; max-width: 500px; margin-bottom: 16px; }
        .level-row {
            display: flex; align-items: center; gap: 10px;
            background: var(--card-bg);
            padding: 10px 16px; border-radius: 30px;
            border: 2px solid var(--border);
            box-shadow: 0 4px 15px var(--shadow);
        }
        [data-theme="dark"] .level-row { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 15px rgba(255,140,26,0.15); }
        .level-badge {
            font-size: 14px; font-weight: 900; color: #fff;
            background: linear-gradient(135deg, var(--accent) 0%, #ffb347 100%);
            padding: 6px 14px; border-radius: 20px;
            white-space: nowrap;
        }
        [data-theme="dark"] .level-badge { box-shadow: var(--neon); }
        .level-bar {
            flex: 1; height: 12px; background: var(--bg-gradient-1);
            border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border);
        }
        .level-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ffb347);
            transition: width 0.5s;
        }
        [data-theme="dark"] .level-fill {
            box-shadow: 0 0 10px rgba(255, 140, 26, 0.8), 0 0 20px rgba(255, 140, 26, 0.5);
        }
        .level-xp {
            font-size: 12px; font-weight: 700; color: var(--text-secondary);
            white-space: nowrap;
        }

        /* ==================== ГЛОБАЛЬНАЯ ТЁМНАЯ ТЕМА ==================== */

        /* 1. ПЛАШКИ И КАРТОЧКИ — ФОН */
        [data-theme="dark"] .car-card,
        [data-theme="dark"] .achievement-card,
        [data-theme="dark"] .ach-card,
        [data-theme="dark"] .trade-card,
        [data-theme="dark"] .friend-card,
        [data-theme="dark"] .user-row,
        [data-theme="dark"] .leader-row,
        [data-theme="dark"] .spec,
        [data-theme="dark"] .form-box,
        [data-theme="dark"] .notif-item,
        [data-theme="dark"] .news-card,
        [data-theme="dark"] .admin-row,
        [data-theme="dark"] .admin-news-row,
        [data-theme="dark"] .collection-card,
        [data-theme="dark"] .news-full,
        [data-theme="dark"] .side,
        [data-theme="dark"] .action-box,
        [data-theme="dark"] .message-box,
        [data-theme="dark"] .bonus-quest,
        [data-theme="dark"] .profile-bio,
        [data-theme="dark"] .profile-fav-card,
        [data-theme="dark"] .stat-box,
        [data-theme="dark"] .wheel-info,
        [data-theme="dark"] .create-block,
        [data-theme="dark"] .race-card,
        [data-theme="dark"] .quest-card,
        [data-theme="dark"] .result-side,
        [data-theme="dark"] .result-summary,
        [data-theme="dark"] .search-block,
        [data-theme="dark"] .settings-box,
        [data-theme="dark"] .compare-col,
        [data-theme="dark"] .specs-compare,
        [data-theme="dark"] .journal-wrap,
        [data-theme="dark"] .user-info-card,
        [data-theme="dark"] .current-discount,
        [data-theme="dark"] .no-cars-hint,
        [data-theme="dark"] .bonus-wait,
        [data-theme="dark"] .stat-pill,
        [data-theme="dark"] .balance-pill,
        [data-theme="dark"] .count-pill,
        [data-theme="dark"] .info-pill,
        [data-theme="dark"] .stats-pill,
        [data-theme="dark"] .user-level-line,
        [data-theme="dark"] .section-pill,
        [data-theme="dark"] .total-info,
        [data-theme="dark"] .action-box,
        [data-theme="dark"] .result-box,
        [data-theme="dark"] .cooldown-box,
        [data-theme="dark"] .slider-value,
        [data-theme="dark"] .my-rank,
        [data-theme="dark"] .profile-count,
        [data-theme="dark"] .trade-message,
        [data-theme="dark"] .spec-label,
        [data-theme="dark"] .notice-box,
        [data-theme="dark"] .claimed-notice,
        [data-theme="dark"] .not-ready-notice {
            background: var(--card-bg) !important;
            border-color: var(--border) !important;
        }

        /* 2. ГРАДИЕНТЫ И ФОНЫ ПОД КАРТИНКАМИ */
        [data-theme="dark"] .car-image,
        [data-theme="dark"] .car-detail-image,
        [data-theme="dark"] .compare-image,
        [data-theme="dark"] .trade-car,
        [data-theme="dark"] .reward-image,
        [data-theme="dark"] .bonus-car-img,
        [data-theme="dark"] .car-preview,
        [data-theme="dark"] .side-car img {
            background: linear-gradient(135deg, #1a1a2e 0%, #2a2a45 100%) !important;
        }

        /* 3. ТЕКСТ — ОСНОВНОЙ */
        [data-theme="dark"] .car-model,
        [data-theme="dark"] .car-model a,
        [data-theme="dark"] .collection-name,
        [data-theme="dark"] .profile-fav-name,
        [data-theme="dark"] .compare-name,
        [data-theme="dark"] .side-model,
        [data-theme="dark"] .result-name,
        [data-theme="dark"] .result-model,
        [data-theme="dark"] .trade-from,
        [data-theme="dark"] .friend-name,
        [data-theme="dark"] .leader-name,
        [data-theme="dark"] .leader-name a,
        [data-theme="dark"] .user-name,
        [data-theme="dark"] .ach-title,
        [data-theme="dark"] .setting-title,
        [data-theme="dark"] .form-label,
        [data-theme="dark"] .notif-title,
        [data-theme="dark"] .news-title,
        [data-theme="dark"] .reward-value,
        [data-theme="dark"] .bonus-model,
        [data-theme="dark"] .car-refund,
        [data-theme="dark"] .stat-num,
        [data-theme="dark"] .stat-label,
        [data-theme="dark"] .rarity-badge,
        [data-theme="dark"] .collection-progress-text,
        [data-theme="dark"] .wheel-title,
        [data-theme="dark"] .section-h,
        [data-theme="dark"] .section-title,
        [data-theme="dark"] .page-title,
        [data-theme="dark"] .total-users,
        [data-theme="dark"] .total-info,
        [data-theme="dark"] .action-title,
        [data-theme="dark"] .message-text,
        [data-theme="dark"] .trade-car div,
        [data-theme="dark"] .side-car div,
        [data-theme="dark"] .spec-value,
        [data-theme="dark"] .side-title,
        [data-theme="dark"] .side-coins,
        [data-theme="dark"] .result-amount,
        [data-theme="dark"] .rating-num,
        [data-theme="dark"] .col-name,
        [data-theme="dark"] .car-detail-name,
        [data-theme="dark"] .car-detail-brand,
        [data-theme="dark"] .car-detail-price,
        [data-theme="dark"] .balance-line,
        [data-theme="dark"] .waiting-text,
        [data-theme="dark"] .bonus-title,
        [data-theme="dark"] .bonus-rewards,
        [data-theme="dark"] .reward-coins,
        [data-theme="dark"] .reward-xp,
        [data-theme="dark"] .reward-label,
        [data-theme="dark"] .reward-card,
        [data-theme="dark"] .stat-value,
        [data-theme="dark"] .hint,
        [data-theme="dark"] .my-rank strong,
        [data-theme="dark"] .profile-count strong,
        [data-theme="dark"] .admin-name,
        [data-theme="dark"] .admin-meta,
        [data-theme="dark"] .admin-desc,
        [data-theme="dark"] .admin-news-title,
        [data-theme="dark"] .admin-news-meta,
        [data-theme="dark"] .trade-model,
        [data-theme="dark"] .trade-side-label,
        [data-theme="dark"] .message-label,
        [data-theme="dark"] .car-check-item,
        [data-theme="dark"] .car-check-item span {
            color: var(--text-main) !important;
        }

        /* 4. ТЕКСТ — ВТОРОСТЕПЕННЫЙ */
        [data-theme="dark"] .collection-desc,
        [data-theme="dark"] .spec-label,
        [data-theme="dark"] .setting-desc,
        [data-theme="dark"] .notif-text,
        [data-theme="dark"] .notif-date,
        [data-theme="dark"] .news-preview,
        [data-theme="dark"] .news-date,
        [data-theme="dark"] .ach-desc,
        [data-theme="dark"] .car-brand,
        [data-theme="dark"] .friend-stats,
        [data-theme="dark"] .trade-from strong,
        [data-theme="dark"] .trade-from,
        [data-theme="dark"] .col-desc,
        [data-theme="dark"] .progress-text,
        [data-theme="dark"] .rating-num,
        [data-theme="dark"] .hint {
            color: var(--text-secondary) !important;
        }

        /* 5. ИНПУТЫ, СЕЛЕКТЫ, TEXTAREA */
        [data-theme="dark"] .form-select,
        [data-theme="dark"] .form-input,
        [data-theme="dark"] .form-file,
        [data-theme="dark"] .form-textarea,
        [data-theme="dark"] select,
        [data-theme="dark"] input[type="text"],
        [data-theme="dark"] input[type="number"],
        [data-theme="dark"] input[type="password"],
        [data-theme="dark"] input[type="file"],
        [data-theme="dark"] input[type="email"],
        [data-theme="dark"] textarea {
            background: var(--card-bg-solid) !important;
            color: var(--text-main) !important;
            border-color: var(--border) !important;
        }
        [data-theme="dark"] select option {
            background: var(--card-bg-solid) !important;
            color: var(--text-main) !important;
        }
        [data-theme="dark"] input::placeholder,
        [data-theme="dark"] textarea::placeholder {
            color: var(--text-hint) !important;
            opacity: 0.7;
        }

        /* 6. КНОПКИ-ЧИПЫ И ВКЛАДКИ */
        [data-theme="dark"] .page-btn,
        [data-theme="dark"] .page-num,
        [data-theme="dark"] .sort-chip,
        [data-theme="dark"] .filter-chip,
        [data-theme="dark"] .tab,
        [data-theme="dark"] .btn-secondary {
            background: var(--card-bg-solid) !important;
            color: var(--text-main) !important;
            border-color: var(--border) !important;
        }
        [data-theme="dark"] .page-num.active,
        [data-theme="dark"] .sort-chip.active,
        [data-theme="dark"] .filter-chip.active,
        [data-theme="dark"] .tab.active {
            background: var(--accent) !important;
            color: #fff !important;
            border-color: var(--accent) !important;
            box-shadow: var(--neon) !important;
        }

        /* 7. МЕЛКИЕ КНОПКИ В КАРТОЧКАХ */
        [data-theme="dark"] .fav-btn,
        [data-theme="dark"] .delete-btn,
        [data-theme="dark"] .admin-btn,
        [data-theme="dark"] .wish-btn {
            background: var(--card-bg-solid) !important;
            color: var(--accent) !important;
        }
        [data-theme="dark"] .fav-btn.active,
        [data-theme="dark"] .wish-btn.active {
            color: var(--accent) !important;
        }

        /* 8. СТРОКИ РЕЙТИНГА */
        [data-theme="dark"] .leader-row.me {
            background: linear-gradient(135deg, rgba(255, 140, 26, 0.2) 0%, rgba(255, 179, 71, 0.15) 100%) !important;
            border-color: var(--accent) !important;
            box-shadow: var(--neon) !important;
        }

        /* 9. ПРОСМОТР ОБМЕНОВ — старые */
        [data-theme="dark"] .trade-card.history {
            background: var(--card-bg) !important;
            border-color: var(--border) !important;
        }

        /* 10. РЕДКОСТИ КОЛЛЕКЦИЙ */
        .collection-card.rarity-common,
        .admin-row.rarity-common,
        .collection-header.rarity-common {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 6px 20px var(--shadow) !important;
            border-color: #bdbdbd !important;
        }
        [data-theme="dark"] .collection-card.rarity-common,
        [data-theme="dark"] .admin-row.rarity-common,
        [data-theme="dark"] .collection-header.rarity-common {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.35), 0 6px 20px rgba(0, 0, 0, 0.4) !important;
        }

        .collection-card.rarity-rare,
        .admin-row.rarity-rare,
        .collection-header.rarity-rare {
            box-shadow: 0 0 20px rgba(66, 165, 245, 0.6), 0 6px 20px rgba(66, 165, 245, 0.3) !important;
            border-color: #42a5f5 !important;
        }
        [data-theme="dark"] .collection-card.rarity-rare,
        [data-theme="dark"] .admin-row.rarity-rare,
        [data-theme="dark"] .collection-header.rarity-rare {
            box-shadow: 0 0 25px rgba(66, 165, 245, 0.8), 0 0 45px rgba(66, 165, 245, 0.4), 0 6px 20px rgba(0, 0, 0, 0.4) !important;
        }

        .collection-card.rarity-legendary,
        .admin-row.rarity-legendary,
        .collection-header.rarity-legendary {
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.7), 0 6px 20px rgba(255, 193, 7, 0.3) !important;
            border-color: #ffc107 !important;
        }
        [data-theme="dark"] .collection-card.rarity-legendary,
        [data-theme="dark"] .admin-row.rarity-legendary,
        [data-theme="dark"] .collection-header.rarity-legendary {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 50px rgba(255, 215, 0, 0.5), 0 0 80px rgba(255, 215, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.4) !important;
        }

        /* 11. ЖЁСТКОЕ ПЕРЕКРЫТИЕ ЛЮБЫХ ГРАДИЕНТОВ */
        [data-theme="dark"] .car-image,
        [data-theme="dark"] .car-detail-image,
        [data-theme="dark"] .compare-image,
        [data-theme="dark"] .trade-car,
        [data-theme="dark"] .reward-image,
        [data-theme="dark"] .bonus-car-img,
        [data-theme="dark"] .car-preview {
            background-image: linear-gradient(135deg, #1a1a2e 0%, #2a2a45 100%) !important;
            background-color: transparent !important;
        }

        @media (max-width: 600px) {
            .form-box { padding: 25px; }
            .description { font-size: 16px; padding: 22px; }
            .btn { padding: 14px 32px; font-size: 17px; }
            .footer-contacts { flex-direction: column; gap: 12px; }
            .float-btn { width: 46px; height: 46px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-contacts">
            <a href="https://t.me/Belikaya_imperia" target="_blank" rel="noopener">✈️ Telegram</a>
            <a href="mailto:imatvej170@gmail.com">📧 imatvej170@gmail.com</a>
            <a href="mailto:appleat0yt52@gmail.com">📧 appleat0yt52@gmail.com</a>
        </div>
    </footer>

    <div class="float-buttons">
        {% if user %}
            <a href="/notifications" class="float-btn notif-btn" title="Уведомления">
                🔔
                {% if unread_notifications_global %}
                    <span class="notif-count">{{ unread_notifications_global }}</span>
                {% endif %}
            </a>
        {% endif %}
        <button type="button" class="float-btn" id="themeToggle" title="Сменить тему">🌙</button>
        <a href="#" class="float-btn hidden" id="scrollTop" title="Наверх">↑</a>
    </div>

    <audio id="bgMusic" loop preload="none">
        <source src="{{ url_for('static', filename='music.mp3') }}" type="audio/mpeg">
    </audio>

    <script>
        const USER_SETTINGS = {
            sound: {{ 'true' if appearance.sound else 'false' }},
            music: {{ 'true' if appearance.music else 'false' }},
            vibration: {{ 'true' if appearance.vibration else 'false' }},
            dark: {{ 'true' if appearance.dark else 'false' }}
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { return null; }
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'sine', volume = 0.1) {
            if (!USER_SETTINGS.sound) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        function vibrate(pattern) {
            if (!USER_SETTINGS.vibration) return;
            if (!navigator.vibrate) return;
            try {
                let p = pattern;
                if (typeof pattern === 'number') p = Math.max(pattern, 30);
                else if (Array.isArray(pattern)) p = pattern.map(v => Math.max(v, 30));
                navigator.vibrate(p);
            } catch (e) {}
        }

        const Sound = {
            click:  () => { playTone(800, 0.05, 'sine', 0.06); vibrate(8); },
            coin:   () => { playTone(1200, 0.1, 'sine', 0.1); setTimeout(() => playTone(1600, 0.1, 'sine', 0.1), 60); },
            buy:    () => { playTone(600, 0.1); setTimeout(() => playTone(800, 0.1), 80); setTimeout(() => playTone(1000, 0.15), 160); },
            win:    () => { playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 100); setTimeout(() => playTone(784, 0.2), 200); },
            lose:   () => { playTone(400, 0.15); setTimeout(() => playTone(300, 0.25), 100); },
            levelup:() => { playTone(659, 0.1); setTimeout(() => playTone(784, 0.1), 80); setTimeout(() => playTone(1047, 0.3), 160); }
        };

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('button, .btn, .sort-chip, .float-btn, .filter-chip, .tab, .admin-btn, .wish-btn, .fav-btn');
            if (btn && !btn.disabled) Sound.click();
        });

        document.querySelectorAll('form').forEach(f => {
            f.addEventListener('submit', () => {
                const action = f.getAttribute('action') || '';
                if (action.includes('/buy/')) Sound.buy();
                else if (action.includes('/bonus') || action.includes('/claim')) Sound.coin();
                else if (action.includes('/spin')) Sound.coin();
            });
        });

        const themeToggle = document.getElementById('themeToggle');
        const rootEl = document.documentElement;

        function updateThemeButton() {
            const isDark = rootEl.getAttribute('data-theme') === 'dark';
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        }
        updateThemeButton();

        themeToggle.addEventListener('click', () => {
            const isDark = rootEl.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            rootEl.setAttribute('data-theme', newTheme);
            USER_SETTINGS.dark = !isDark;
            updateThemeButton();
            saveAppearance();
        });

        function saveAppearance() {
            fetch('/appearance', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({
                    sound: USER_SETTINGS.sound ? '1' : '',
                    music: USER_SETTINGS.music ? '1' : '',
                    vibration: USER_SETTINGS.vibration ? '1' : '',
                    dark: USER_SETTINGS.dark ? '1' : ''
                })
            }).catch(() => {});
        }

        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.25;

        function tryPlayMusic() {
            if (!USER_SETTINGS.music) return;
            if (!bgMusic.src) return;
            bgMusic.play().catch(() => {});
        }

        document.addEventListener('click', function firstClick() {
            tryPlayMusic();
            document.removeEventListener('click', firstClick);
        }, { once: true });

        const scrollBtn = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) scrollBtn.classList.remove('hidden');
            else scrollBtn.classList.add('hidden');
        });
        scrollBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
