<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoKards{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe0b3 100%);
            color: #4a2c00;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
        }
        .logo {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ff8c1a;
            text-shadow: 3px 3px 0 #ffd9a6, 6px 6px 15px rgba(255, 140, 26, 0.3);
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        .logo a { color: inherit; text-decoration: none; }

        .btn {
            padding: 16px 45px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #ff8c1a;
            color: #fff;
            box-shadow: 0 6px 18px rgba(255, 140, 26, 0.4);
        }
        .btn-primary:hover {
            background: #e67a00;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 140, 26, 0.55);
        }
        .btn-secondary {
            background: #fff;
            color: #ff8c1a;
            border: 2px solid #ff8c1a;
        }
        .btn-secondary:hover { background: #ffe0b3; transform: translateY(-3px); }

        /* Формы */
        .form-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #ffd9a6;
            box-shadow: 0 10px 30px rgba(255, 140, 26, 0.15);
            width: 100%;
            max-width: 420px;
        }
        .form-box h2 {
            color: #ff8c1a;
            font-size: 32px;
            margin-bottom: 25px;
        }
        .form-box input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #ffd9a6;
            border-radius: 12px;
            margin-bottom: 15px;
            font-family: inherit;
            background: #fff;
            color: #4a2c00;
            transition: border-color 0.3s;
        }
        .form-box input:focus {
            outline: none;
            border-color: #ff8c1a;
        }
        .form-box .btn { width: 100%; margin-top: 10px; }
        .form-link {
            display: block;
            margin-top: 20px;
            color: #6b3d00;
            font-size: 15px;
        }
        .form-link a { color: #ff8c1a; font-weight: 700; text-decoration: none; }
        .form-link a:hover { text-decoration: underline; }

        /* Сообщения об ошибках */
        .flash {
            background: #ffe0b3;
            border: 2px solid #ff8c1a;
            color: #6b3d00;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        /* Приветствие на главной */
        .welcome {
            font-size: 20px;
            color: #6b3d00;
            margin-bottom: 25px;
        }
        .welcome strong { color: #ff8c1a; font-size: 24px; }

        .description {
            max-width: 750px;
            font-size: 19px;
            line-height: 1.7;
            color: #6b3d00;
            background: rgba(255, 255, 255, 0.6);
            padding: 30px 35px;
            border-radius: 20px;
            border: 1px solid #ffd9a6;
            margin-top: 20px;
        }
        .description strong { color: #ff8c1a; }

        .buttons { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }

        footer {
            background: #ff8c1a;
            color: #fff;
            padding: 25px 20px;
            text-align: center;
        }
        .footer-contacts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 25px;
            font-size: 16px;
        }
        .footer-contacts a {
            color: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }
        .footer-contacts a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

        @media (max-width: 600px) {
            .form-box { padding: 25px; }
            .description { font-size: 16px; padding: 22px; }
            .btn { padding: 14px 32px; font-size: 17px; }
            .footer-contacts { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-contacts">
            <a href="https://t.me/Belikaya_imperia" target="_blank" rel="noopener">✈️ Telegram</a>
            <a href="mailto:imatvej170@gmail.com">📧 imatvej170@gmail.com</a>
            <a href="mailto:appleat0yt52@gmail.com">📧 appleat0yt52@gmail.com</a>
        </div>
    </footer>
</body>
</html>
